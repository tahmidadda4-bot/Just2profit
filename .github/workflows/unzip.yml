name: Extract Just2Profit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o Just2Profit-Starter.zip
          if [ -d "Just2Profit" ]; then
            cp -r Just2Profit/. .
          fi
          rm -rf Just2Profit
          rm -f Just2Profit-Starter.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Just2Profit project [skip ci]" || echo "Nothing to commit"
          git push
